<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Assessment Management System</title>
<meta name="description" content="Assessment, Rubric &amp; CO Analysis Portal for engineering faculty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <button id="hamburgerBtn" class="icon-btn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="mobile-bar-title">FAMS</span>
    <button id="mobileThemeToggle" class="icon-btn" aria-label="Toggle dark mode">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
  </div>

  <div id="sidebarOverlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">FA</div>
      <div class="brand-text">
        <div class="brand-title">Faculty Assessment</div>
        <div class="brand-sub">Management System</div>
      </div>
    </div>

    <nav class="nav-menu" aria-label="Primary">
      <button class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="12" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="16" width="7" height="5" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-page="subject">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 19V5.5" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Subject Setup</span>
      </button>
      <button class="nav-item" data-page="students">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="17.5" cy="8.5" r="2.3" stroke="currentColor" stroke-width="1.6"/><path d="M15.8 13.2c2.9.2 5.2 2.6 5.2 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Students</span>
      </button>
      <button class="nav-item" data-page="assessments">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6l1 3H8l1-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="5" y="6" width="14" height="15" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 11h7M8.5 14.5h7M8.5 18h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Assessments</span>
      </button>
      <button class="nav-item" data-page="marks">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="1.8" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M8 9v11" stroke="currentColor" stroke-width="1.6"/><path d="M11.5 13.2l1.6 1.6 3-3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Mark Entry</span>
      </button>
      <button class="nav-item" data-page="coanalysis">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10.5 20V4M17 20v-7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span>CO Analysis</span>
      </button>
      <button class="nav-item" data-page="studentanalysis">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9 20l1.6-4M15 20l-1.6-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <span>Student Analysis</span>
      </button>
      <button class="nav-item" data-page="reports">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 3h7l5 5v13H7V3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.5 13h5M9.5 16.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Reports &amp; Backup</span>
      </button>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.55 1.55M7.15 16.85 5.6 18.4M18.4 18.4l-1.55-1.55M7.15 7.15 5.6 5.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button id="sidebarThemeToggle" class="theme-toggle-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v2M12 19v2M5 5l1.5 1.5M17.5 17.5L19 19M3 12h2M19 12h2M5 19l1.5-1.5M17.5 6.5L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/></svg>
        <span id="themeToggleLabel">Dark mode</span>
      </button>
      <div class="save-status" id="saveStatus">
        <span class="save-dot"></span>
        <span id="saveStatusText">Saved locally</span>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-area">
    <header class="page-header">
      <div class="page-header-left">
        <h1 id="pageTitle">Dashboard</h1>
        <div class="page-header-sub" id="pageSubtitle">Subject Code · Subject Name</div>
      </div>
      <div class="page-header-right">
        <div class="save-status desktop-only" id="saveStatusTop">
          <span class="save-dot"></span>
          <span id="saveStatusTextTop">Saved locally</span>
        </div>
      </div>
    </header>

    <div class="page-content" id="pageContent">
      <!-- injected per page -->
    </div>
  </main>
</div>

<div id="toastContainer" class="toast-container" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" onerror="window.__CHART_JS_FAILED__=true"></script>
<script src="js/storage.js"></script>
<script src="js/students.js"></script>
<script src="js/assessments.js"></script>
<script src="js/marks.js"></script>
<script src="js/analysis.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
